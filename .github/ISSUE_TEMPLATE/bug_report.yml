name: Bug report
description: Report reproducible, incorrect behavior in Altkit Discord
title: "[Bug]: "
labels:
  - bug
  - need repro
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Altkit Discord.

        > **Never include a Discord token, password, TOTP secret, proxy credential, session cookie, private invite, or unredacted personal data.** If a credential may have been exposed, rotate it before continuing.

        For security vulnerabilities, use the private **Security vulnerability** link shown on the issue chooser instead of opening a public issue.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Choose the area that most closely matches the problem.
      options:
        - Gateway, client, or events
        - REST API or rate limits
        - Messages, channels, guilds, or users
        - Interactions, components, or applications
        - Presence or activities
        - Voice, audio, or video
        - TypeScript declarations
        - Package exports or installation
        - Documentation or examples
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Clearly describe what went wrong and when it happens.
      placeholder: A concise description of the incorrect behavior.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Install @altkit/discord version ...
        2. Run the minimal example below...
        3. Trigger...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal reproduction
      description: Paste a complete, minimal program with every credential and private identifier replaced. This field is formatted as JavaScript automatically.
      render: javascript
      placeholder: |
        const { Client } = require('@altkit/discord');

        // Minimal code that reproduces the problem.
        // Read credentials only from environment variables.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full relevant error and sanitized logs where applicable.
      placeholder: What happened? Include the error type, message, and stack trace.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected and why.
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: input
    id: altkit-version
    attributes:
      label: Altkit Discord version
      description: Run `npm list @altkit/discord` in the affected project.
      placeholder: "@altkit/discord@4.0.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`. Altkit Discord v4 requires Node.js 20.18 or newer.
      placeholder: "v22.17.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the name, version, and architecture where relevant.
      placeholder: "Ubuntu 24.04 x64, Windows 11 x64, or macOS 15 arm64"
    validations:
      required: true

  - type: input
    id: package-manager
    attributes:
      label: Package manager
      description: Include the package manager and version used to install the library.
      placeholder: "npm 11.4.2"
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression
      description: Did the same code work with an earlier Altkit Discord release?
      options:
        - "Yes"
        - "No"
        - Unsure
    validations:
      required: true

  - type: input
    id: last-working-version
    attributes:
      label: Last known working version
      description: If this is a regression, provide the most recent version that worked.
      placeholder: "@altkit/discord@4.x.x or not applicable"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, links to public API documentation, or other relevant details.

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched open and closed issues for an existing report.
          required: true
        - label: I reproduced this with a supported Node.js version and a minimal example.
          required: true
        - label: I removed all tokens, TOTP secrets, proxy credentials, private IDs, and personal data.
          required: true
        - label: I understand that automating a normal Discord user account violates Discord's Terms of Service and may result in account termination.
          required: true
