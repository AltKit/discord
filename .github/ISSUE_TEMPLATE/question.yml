name: Usage question
description: Ask a focused question about using Altkit Discord
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Before asking, check the README, examples, migration guide, and existing issues. This tracker cannot provide Discord account support or help recover, obtain, or extract user tokens.

        Never include a Discord token, password, TOTP secret, proxy credential, private invite, or unredacted personal data.

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the intended result and the relevant Altkit Discord feature.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include a small sanitized example and links to documentation you consulted.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: Describe the result or error that is blocking you.
    validations:
      required: true

  - type: input
    id: altkit-version
    attributes:
      label: Altkit Discord version
      placeholder: "@altkit/discord@4.0.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "v22.17.0"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched the documentation and open and closed issues first.
          required: true
        - label: I removed all credentials, private identifiers, and personal data.
          required: true
        - label: My question is about Altkit Discord rather than general Discord account support.
          required: true
