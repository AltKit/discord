name: Release

on:
  push:
    tags:
      - 'v4.*.*'
      - '4.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}

jobs:
  publish:
    name: Publish @altkit/discord
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version=${RELEASE_TAG#v}
          test "$package_version" = "$tag_version"

      - name: Run checks
        run: npm test

      - name: Verify generated documentation is current
        run: |
          docs_date=$(node -p "require('./docs/main.json').meta.date")
          npm run docs
          DOCS_DATE="$docs_date" node -e "const fs=require('node:fs'); const docs=require('./docs/main.json'); docs.meta.date=Number(process.env.DOCS_DATE); fs.writeFileSync('docs/main.json', JSON.stringify(docs));"
          git diff --exit-code -- docs/main.json

      - name: Inspect publish archive
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
